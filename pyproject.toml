[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedrift"
version = "0.1.0"
description = "Offline deep-pagination drift and continuity verification bench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pagedrift = "pagedrift.cli:main"

[tool.setuptools.packages.find]
include = ["pagedrift*"]

[tool.setuptools.package-data]
pagedrift = ["plans/*.yaml", "fixtures/*.jsonl", "fixtures/golden/*", "fixtures/catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
