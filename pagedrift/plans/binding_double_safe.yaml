# Synthetic fixture for the cycle-binding double-safe scenario.
# Four initial records, two per page; the schedule inserts one beta record
# before the second request. keyset and snapshot both audit safe, but the
# keyset delivery contains the inserted record while the snapshot delivery
# does not, so an unassisted attribution is ambiguous.
version: 1

dataset:
  name: binding-double-safe
  size: 4
  seed: 5
  start_key: 10
  key_step: 3

source:
  base_url: http://127.0.0.1:8765
  items_path: /items
  meta_path: /meta
  sort_key: sort_key
  offset_param: offset
  limit_param: limit
  page_param: page
  page_size_param: page_size
  after_key_param: after_key
  snapshot_param: snapshot
  max_page_size: 500

strategies:
  offset:
    limit: 2
    max_pages: 10
  pagenum:
    page_size: 2
    max_pages: 10
  keyset:
    limit: 2
    max_pages: 10
  snapshot:
    limit: 2
    max_pages: 10

mutation_schedule: binding_double_safe_schedule.yaml

termination:
  allow:
    - saw_empty_page
    - partial_page_lt_limit
    - exhausted_by_max_key

audit:
  max_dup_ratio: 0.0
  allow_out_of_order: false
  allow_insert_extra: true
